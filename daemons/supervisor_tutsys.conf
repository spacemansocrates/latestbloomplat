[program:tutsys-daemon]
command=/usr/bin/php /var/www/html/tutsys3.0/daemons/lesson_notification_daemon.php
directory=/var/www/html/tutsys3.0/daemons
user=www-data
autostart=true
autorestart=true
startretries=3
startsecs=10
redirect_stderr=true
stdout_logfile=/var/www/html/tutsys3.0/daemons/daemon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/tutsys3.0/daemons/daemon_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=HOME="/var/www/html/tutsys3.0"
