<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assessment icons: renderer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #faf5e7; color: #191b18; padding: 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; }
  figure { margin: 0; width: 96px; text-align: center; font-size: 12px; }
  figure img { width: 64px; height: 64px; background: #f6dc73; border-radius: 50%; padding: 10px; box-sizing: border-box; }
</style>
</head>
<body>
<!--
  Source of truth for the report email's icons (utils/assessment_ring.php and
  utils/assessment_report.php use the PNGs this page renders).

  Email clients cannot show SVG, so every icon is rasterised once, here, to a PNG in
  assets/assessment-icons/. To change or add an icon: edit ICONS below, open this page
  in a browser, and save each PNG (click it) over the file of the same name. Keep the
  24x24 viewBox and the 1.65 stroke so the set stays consistent with the score dial.
-->
<h1>Assessment icons</h1>
<p>Click an icon to download its PNG. Skill icons are drawn in #363c30, action icons in #191b18.</p>
<div class="grid" id="grid"></div>
<script>
const SKILL = '#363c30', ACTION = '#191b18', MUTED = '#7b7c72';
const ICONS = {
  // ---- skill icons
  hash:       [SKILL, '<path d="M10 3 8 21M16 3l-2 18M4 8.5h16M3.5 15.5h16"/>'],
  pie:        [SKILL, '<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.3"/>'],
  scale:      [SKILL, '<path d="M12 3v17M7 20h10M5 6.5h14"/><path d="M5 6.5 2.2 13a2.9 2.9 0 0 0 5.6 0L5 6.5ZM19 6.5 16.2 13a2.9 2.9 0 0 0 5.6 0L19 6.5Z"/>'],
  xsquared:   [SKILL, '<path d="m3.5 8 8 11M11.5 8l-8 11"/><path d="M14.6 6.6c.3-1.7 3.9-1.9 3.9.4 0 1.8-4 3.3-4 5.2h4.6"/>'],
  triangle:   [SKILL, '<path d="M4 20V4.5L19.5 20H4Z"/><path d="M4 14a6 6 0 0 1 6 6"/>'],
  chart:      [SKILL, '<path d="M3.5 20.5h17"/><rect x="5.5" y="12" width="3" height="6" rx=".7"/><rect x="10.5" y="5.5" width="3" height="12.5" rx=".7"/><rect x="15.5" y="9" width="3" height="9" rx=".7"/>'],
  calculator: [SKILL, '<rect x="5" y="3" width="14" height="18" rx="2.2"/><path d="M8.5 7h7M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15.5h.01M12 15.5h.01M15.5 15.5h.01"/>'],
  ruler:      [SKILL, '<path d="M3 16 16 3l5 5L8 21l-5-5Z"/><path d="m7 12 2 2M10 9l2 2M13 6l2 2"/>'],
  dna:        [SKILL, '<path d="M7 2c-1 6 1 8 5 10s6 4 5 10M17 2c1 6-1 8-5 10s-6 4-5 10M7 4h10M8 7h8M9 10h6M9 14h6M8 17h8M7 20h10"/>'],
  flask:      [SKILL, '<path d="M9 3h6M10 3v6.5L4.8 18.3A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.7L14 9.5V3"/><path d="M7.2 15h9.6"/>'],
  atom:       [SKILL, '<circle cx="12" cy="12" r="1.2"/><ellipse cx="12" cy="12" rx="9.5" ry="3.7"/><ellipse cx="12" cy="12" rx="9.5" ry="3.7" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.7" transform="rotate(120 12 12)"/>'],
  clipboard:  [SKILL, '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3.2H9z"/><path d="m8.6 13.2 2.4 2.4 4.4-4.8"/>'],
  search:     [SKILL, '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/>'],
  bulb:       [SKILL, '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.8 10.6c.6.5.8 1.2.8 2.4h6c0-1.2.2-1.9.8-2.4A6 6 0 0 0 12 3Z"/>'],
  quote:      [SKILL, '<path d="M10 6.5H4.5v5.5H9c0 2.4-1.2 4-3.5 5"/><path d="M19.5 6.5H14v5.5h4.5c0 2.4-1.2 4-3.5 5"/>'],
  pencil:     [SKILL, '<path d="m4 20 1.2-4.4L15.8 5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8 4 20Z"/><path d="m14 6.8 3.2 3.2"/>'],
  book:       [SKILL, '<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1V5Z"/><path d="M12 6v14"/>'],
  plusminus:  [SKILL, '<path d="M7 3.5v7M3.5 7h7M13.5 17h7M19 5 5 19"/>'],
  times:      [SKILL, '<path d="m4.5 4.5 5 5m0-5-5 5M13.5 17h7M19 5 5 19"/><path d="M17 13.6h.01M17 20.4h.01" stroke-width="2.6"/>'],
  abc:        [SKILL, '<path d="M3 19 7.5 5 12 19M4.6 14h5.8M15 5v14"/><circle cx="18.3" cy="15.7" r="3.3"/>'],
  punctuation:[SKILL, '<path d="M4.5 8a3.5 3.5 0 1 1 5.6 2.8c-1 .8-1.6 1.5-1.6 2.7v1M17 4.5v10"/><path d="M8.5 19h.01M17 19h.01" stroke-width="2.6"/>'],
  // ---- action and caption icons
  calendar:   [ACTION, '<rect x="4" y="5" width="16" height="16" rx="1"/><path d="M8 3v4m8-4v4M4 10h16"/>'],
  chat:       [ACTION, '<path d="M3 4h18v14h-7l-3 3-3-3H3V4Z"/><path d="M7 8h10M7 11h10M7 14h6"/>'],
  user:       [ACTION, '<circle cx="12" cy="8" r="5"/><path d="M3 21c2-7 16-7 18 0"/>'],
  info:       [MUTED,  '<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>'],
};

function svgFor(colour, body, size) {
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + colour +
         '" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
}
const HEART = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="216" viewBox="-6 -10 112 110"><g transform="rotate(-11 50 45)">' +
  '<path fill="#dfa3cd" d="M50 85C33 70 5 50 5 28 5 3 37-2 50 18 64-3 96 3 96 28 96 50 66 73 50 85Z"/></g></svg>';

function toPng(svg, w, h) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

window.__icons = {};
(async () => {
  const grid = document.getElementById('grid');
  const jobs = Object.entries(ICONS).map(([name, [colour, body]]) => [name, svgFor(colour, body, 128), 128, 128]);
  jobs.push(['heart-deco', HEART, 240, 216]);
  for (const [name, svg, w, h] of jobs) {
    const url = await toPng(svg, w, h);
    window.__icons[name] = url.split(',')[1];
    const f = document.createElement('figure');
    f.innerHTML = '<a download="' + name + '.png" href="' + url + '"><img alt="" src="' + url + '"></a><figcaption>' + name + '</figcaption>';
    grid.appendChild(f);
  }
  window.__done = true;
})();
</script>
</body>
</html>
